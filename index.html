
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spline 3D Integration Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background-color: #000;
      color: #fff;
    }
    /* Custom loader for Spline fallback */
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #FFF;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spotlight {
      0% {
        opacity: 0;
        transform: translate(-72%, -62%) scale(0.5);
      }
      100% {
        opacity: 1;
        transform: translate(-50%,-40%) scale(1);
      }
    }
    .animate-spotlight {
      animation: spotlight 2s ease .75s 1 forwards;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0",
    "@splinetool/react-spline": "https://esm.sh/@splinetool/react-spline@^4.1.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
